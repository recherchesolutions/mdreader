<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!--
  Reader CSP. Relaxations from the strictest baseline, and why:
  - style-src 'unsafe-inline': KaTeX and Mermaid set inline style attributes on
    the elements they generate; our own stylesheets are 'self'.
  - img-src https://mdreader-doc: document images are served from the read-only
    document virtual host, which is a different origin than these assets.
  - img-src file: data:: local images referenced by absolute path, and KaTeX/
    Mermaid occasionally emit data: images inside generated SVG.
  Remote (http/https) images stay blocked here by design; opting in navigates
  to reader-remote.html instead.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://mdreader-doc file: data:; font-src 'self'; connect-src 'none'">
<title>mdreader</title>
<link rel="stylesheet" href="/css/reader.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body>
<aside class="toc" id="toc" aria-label="Table of contents"></aside>
<main class="content" id="content"></main>
<script src="/vendor/highlight/highlight.min.js"></script>
<script src="/vendor/mermaid/mermaid.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/js/reader.js"></script>
</body>
</html>
