name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests with coverage (Core + Shell)
        run: >
          dotnet test tests/MdReader.Core.Tests tests/MdReader.Shell.Tests
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Blocking UI smoke suite (deterministic, gates the build)
        # Log-driven AppHarness tests: open/render, live reload, single-instance
        # handoff, headless HTML/PDF export. No desktop interaction — these must
        # pass.
        env:
          MDREADER_TEST_LOG_DIR: ${{ runner.temp }}/mdreader-test-logs
        run: dotnet test tests/MdReader.Integration.Tests -c Release --no-build --filter "suite=blocking"

      - name: Non-blocking UI tests (FlaUI window automation)
        # Depends on desktop focus on hosted runners; reported, not gating.
        # Exit criterion for promotion: two consecutive green weeks.
        continue-on-error: true
        run: dotnet test tests/MdReader.Integration.Tests -c Release --no-build --filter "suite=nonblocking"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ${{ runner.temp }}/mdreader-test-logs/**
            ${{ runner.temp }}/**/mdreader-test-*.log
          if-no-files-found: ignore

      - name: Performance budgets (deterministic render pipeline)
        run: dotnet run --project benchmarks/MdReader.Benchmarks -c Release -- --check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

  installer:
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: >
          dotnet publish src/MdReader.App -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=true
          -o publish/app

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\MdReader.Installer\mdreader.iss

      - name: Install silently
        run: |
          $setup = Get-ChildItem installer\MdReader.Installer\Output\mdreader-setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait

      - name: Assert install state
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\mdreader\mdreader.exe"
          if (-not (Test-Path $exe)) { throw "mdreader.exe not installed at $exe" }
          # GUI subsystem exe: wait for exit explicitly to get a real exit code.
          $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--version failed with $($p.ExitCode)" }
          $progId = Get-ItemProperty "HKCU:\Software\Classes\MdReader.Markdown.1" -ErrorAction Stop
          if ($progId.'(default)' -ne 'Markdown Document') { throw "ProgId missing" }
          $openWith = Get-Item "HKCU:\Software\Classes\.md\OpenWithProgids" -ErrorAction Stop
          if ($openWith.GetValueNames() -notcontains 'MdReader.Markdown.1') { throw "OpenWithProgids missing" }
          # The guardrail: UserChoice must not have been created by the install.
          $uc = Get-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.md\UserChoice" -ErrorAction SilentlyContinue
          if ($uc -and $uc.GetValue('ProgId') -eq 'MdReader.Markdown.1') { throw "installer wrote UserChoice!" }

      - name: Uninstall silently and assert clean removal
        run: |
          $uninstall = "$env:LOCALAPPDATA\Programs\mdreader\unins000.exe"
          Start-Process $uninstall -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path "$env:LOCALAPPDATA\Programs\mdreader\mdreader.exe") { throw "exe not removed" }
          if (Get-Item "HKCU:\Software\Classes\MdReader.Markdown.1" -ErrorAction SilentlyContinue) { throw "ProgId not removed" }
          $openWith = Get-Item "HKCU:\Software\Classes\.md\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($openWith -and ($openWith.GetValueNames() -contains 'MdReader.Markdown.1')) { throw "OpenWithProgids value not removed" }
