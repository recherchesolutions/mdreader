name: Winget

# Submits/updates the winget manifest when a release is published, so
# `winget install mdreader` works. The FIRST submission must be done manually
# (see packaging/winget/README.md); this workflow handles every update after.
#
# Requires a classic PAT with `public_repo` scope in the WINGET_TOKEN secret
# (used to fork/PR microsoft/winget-pkgs).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to submit (for example, v0.5.0)
        required: true
        type: string

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@main
        with:
          # Must match the identifier as merged in microsoft/winget-pkgs
          # (submitted lowercase in PR #411093).
          identifier: recherchesolutions.mdreader
          installers-regex: 'mdreader-setup-.*\.exe$'
          # release events supply the tag automatically; manual runs must not
          # fall back to the selected branch name (usually "main").
          release-tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
