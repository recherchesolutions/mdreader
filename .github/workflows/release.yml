name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example, 0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          $v = $env:RELEASE_VERSION_INPUT.Trim().TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$v' is not valid SemVer (expected values such as 0.5.0 or 0.5.0-rc.1)."
          }
          $tag = "v$v"
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing Git tags." }
          if ($existingTag) { throw "Tag $tag already exists." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Update release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION

          $propsPath = "Directory.Build.props"
          $props = [IO.File]::ReadAllText($propsPath)
          $updatedProps = [regex]::Replace($props, '<Version>[^<]+</Version>', "<Version>$v</Version>", 1)
          if ($updatedProps -eq $props -and $props -notmatch "<Version>$([regex]::Escape($v))</Version>") {
            throw "Could not update the version in $propsPath."
          }
          [IO.File]::WriteAllText($propsPath, $updatedProps)

          $installerPath = "installer/MdReader.Installer/mdreader.iss"
          $installer = [IO.File]::ReadAllText($installerPath)
          $updatedInstaller = [regex]::Replace($installer, '#define AppVersion "[^"]+"', "#define AppVersion `"$v`"", 1)
          if ($updatedInstaller -eq $installer -and $installer -notmatch "#define AppVersion `"$([regex]::Escape($v))`"") {
            throw "Could not update the fallback version in $installerPath."
          }
          [IO.File]::WriteAllText($installerPath, $updatedInstaller)

          $changelogPath = "CHANGELOG.md"
          $changelog = [IO.File]::ReadAllText($changelogPath)
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($v))\](?: -|$)") {
            $newline = if ($changelog.Contains("`r`n")) { "`r`n" } else { "`n" }
            $heading = "## [Unreleased]"
            if (-not $changelog.Contains($heading)) { throw "CHANGELOG.md has no Unreleased heading." }
            $datedHeading = "## [$v] - $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))"
            $changelog = $changelog.Replace($heading, "$heading$newline$newline$datedHeading")
            [IO.File]::WriteAllText($changelogPath, $changelog)
          }

      - name: Test release candidate
        run: |
          dotnet test tests/MdReader.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed." }
          dotnet test tests/MdReader.Shell.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Shell tests failed." }

      - name: Commit and tag release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props CHANGELOG.md installer/MdReader.Installer/mdreader.iss
          $stagedFiles = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect staged release metadata." }
          if ($stagedFiles.Count -gt 0) {
            git commit -m "Release $env:RELEASE_VERSION"
          }
          git tag -a $env:RELEASE_TAG -m "mdreader $env:RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$env:DEFAULT_BRANCH" "refs/tags/$env:RELEASE_TAG"

  release:
    needs: prepare-release
    if: always() && (github.event_name == 'push' || needs.prepare-release.result == 'success')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-release.outputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $v = $tag.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Test (Core)
        run: dotnet test tests/MdReader.Core.Tests -c Release

      - name: Test (Shell)
        run: dotnet test tests/MdReader.Shell.Tests -c Release

      - name: Publish app (self-contained win-x64)
        run: >
          dotnet publish src/MdReader.App -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/app

      - name: Publish mdreader-convert (single file)
        run: >
          dotnet publish src/MdReader.Cli -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/cli

      - name: Publish mdreader-convert (framework dependent)
        run: >
          dotnet publish src/MdReader.Cli -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/cli-fdd

      - name: Smoke test converter variants
        run: |
          & publish\cli\mdreader-convert.exe --version
          if ($LASTEXITCODE -ne 0) { throw "self-contained converter smoke test failed" }
          dotnet publish\cli-fdd\mdreader-convert.dll --version
          if ($LASTEXITCODE -ne 0) { throw "framework-dependent converter smoke test failed" }

      - name: Sign binaries (optional — skipped without secrets)
        if: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: publish
          files-folder-filter: exe,dll
          files-folder-recurse: true

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            installer\MdReader.Installer\mdreader.iss

      - name: Sign installer (optional — skipped without secrets)
        if: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: installer\MdReader.Installer\Output
          files-folder-filter: exe

      - name: Assemble artifacts
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item "installer\MdReader.Installer\Output\mdreader-setup-$v.exe" artifacts\
          # Portable ZIP: many corporate users cannot run installers.
          Compress-Archive -Path publish\app\* -DestinationPath "artifacts\mdreader-$v-portable-win-x64.zip"
          Copy-Item publish\cli\mdreader-convert.exe "artifacts\mdreader-convert-$v-win-x64.exe"
          Compress-Archive -Path publish\cli-fdd\* -DestinationPath "artifacts\mdreader-convert-$v-framework-dependent-win-x64.zip"
          # Checksums
          Get-ChildItem artifacts | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content artifacts\SHA256SUMS -Encoding ascii

      - name: Generate changelog section
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = $null }
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $log = git log $range --pretty=format:"- %s (%h)" --no-merges
          $body = "## Changes`n`n$($log -join "`n")"
          $body | Set-Content release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            artifacts/*
